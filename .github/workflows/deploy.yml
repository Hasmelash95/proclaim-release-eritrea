name: CI/CD

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab. Any branch can be
  # checked this way, but only main is ever deployed
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-dummy-secret-key
      DEBUG: "True"
      DATABASE_URL: sqlite:///db.sqlite3
      CLOUDINARY_URL: cloudinary://123456789012345:abcdefghijklmnopqrstuvwxyz1@ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations press info --check --dry-run

      # Static files must be collected first, as pages are rendered with
      # WhiteNoise's manifest storage. This also catches collectstatic
      # failures before Heroku runs it during the build
      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: proc-release-eritrea
        run: |
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:refs/heads/main
